services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: teamslot
      POSTGRES_PASSWORD: teamslot
      POSTGRES_DB: teamslot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamslot -d teamslot"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
